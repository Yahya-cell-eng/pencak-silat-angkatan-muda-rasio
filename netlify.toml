[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  CI = "false"
  # Firebase web configuration is intentionally public in the browser bundle.
  # The smart-detection exception contains the same public web API key.
  # Omit that variable too when it is marked secret in the environment.
  # The Emails plugin embeds its non-secret directory path in generated code.
  # Keep NETLIFY_EMAILS_SECRET and all other credentials covered by scanning.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_DATABASE_ID,SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES,NETLIFY_EMAILS_DIRECTORY"

[[plugins]]
  package = "./plugins/netlify-purge-cloudflare-on-deploy"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
